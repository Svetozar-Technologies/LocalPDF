name: Build MAS .pkg

# Single-arch (x86_64) Mac App Store build. Runs on every Mac:
# native on Intel, via Rosetta 2 on Apple Silicon (auto-installs).
# v1.1+ can upgrade to universal2 once PyMuPDF ships universal wheels
# or we vendor a fat-built dependency.
#
# Required GitHub Secrets:
#   MAS_APP_CERT_P12_BASE64
#   MAS_INSTALLER_CERT_P12_BASE64
#   MAS_CERT_PASSWORD
#   MAS_KEYCHAIN_PASSWORD
#   MAS_PROVISIONING_PROFILE_BASE64
#   MAS_APP_IDENTITY              "3rd Party Mac Developer Application: Name (TEAMID)"
#   MAS_INSTALLER_IDENTITY        "3rd Party Mac Developer Installer: Name (TEAMID)"
#
# Optional:
#   APPSTORE_API_KEY_ID
#   APPSTORE_API_ISSUER_ID
#   APPSTORE_API_PRIVATE_KEY_BASE64

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (must match App Store Connect)'
        required: true
        default: '1.0'
      upload_to_app_store:
        description: 'Auto-upload .pkg to App Store Connect'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build-mas:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install x86_64 dependencies via Rosetta
        # `arch -x86_64` forces pip into x86_64 mode so it resolves
        # x86_64 wheels (the universal2 setup-python Python defaults
        # to arm64 wheels on Apple Silicon hardware).
        run: |
          set -euo pipefail
          arch -x86_64 python -m pip install --upgrade pip
          arch -x86_64 python -m pip install -r requirements.txt pyinstaller

      - name: Build LocalPDF.app (x86_64)
        env:
          LOCALPDF_VERSION: ${{ inputs.version }}
          LOCALPDF_TARGET_ARCH: x86_64
        run: |
          set -euo pipefail
          arch -x86_64 python -m PyInstaller LocalPDF.spec --clean --noconfirm
          ls -la dist/

      - name: Import signing certificates
        env:
          APP_CERT_B64: ${{ secrets.MAS_APP_CERT_P12_BASE64 }}
          INSTALLER_CERT_B64: ${{ secrets.MAS_INSTALLER_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MAS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/mas-signing.keychain-db"
          APP_P12="$RUNNER_TEMP/cert-app.p12"
          INSTALLER_P12="$RUNNER_TEMP/cert-installer.p12"

          echo "$APP_CERT_B64"       | base64 --decode > "$APP_P12"
          echo "$INSTALLER_CERT_B64" | base64 --decode > "$INSTALLER_P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$APP_P12"       -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security import "$INSTALLER_P12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

          rm -f "$APP_P12" "$INSTALLER_P12"

      - name: Embed provisioning profile
        env:
          PROFILE_B64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$PROFILE_B64" | base64 --decode > "dist/LocalPDF.app/Contents/embedded.provisionprofile"
          ls -la dist/LocalPDF.app/Contents/embedded.provisionprofile

      - name: Sign nested Mach-O binaries and frameworks
        env:
          APP_ID: ${{ secrets.MAS_APP_IDENTITY }}
        run: |
          set -euo pipefail
          ENT="$GITHUB_WORKSPACE/assets/entitlements/mas.entitlements"
          APP=dist/LocalPDF.app
          MAIN_EXEC="$APP/Contents/MacOS/LocalPDF"

          # Phase 1: Sign loose Mach-O files (dylibs, .so, executables).
          # Skip the .app main executable and any file immediately inside a
          # *.framework directory.
          COUNT=0
          while IFS= read -r -d '' f; do
              [ "$f" = "$MAIN_EXEC" ] && continue
              parent_base=$(basename "$(dirname "$f")")
              if [[ "$parent_base" == *.framework ]]; then
                  continue
              fi
              if file "$f" 2>/dev/null | grep -q "Mach-O"; then
                  codesign --force --options runtime --timestamp \
                      --sign "$APP_ID" --entitlements "$ENT" "$f" >/dev/null
                  COUNT=$((COUNT + 1))
              fi
          done < <(find "$APP/Contents" -depth -type f -print0)
          echo "Phase 1: signed $COUNT loose Mach-O files."

          # Phase 2: Sign each *.framework as a bundle, deepest first.
          # Pass --identifier explicitly so codesign doesn't get confused
          # by PyInstaller's stripped-down framework layout.
          FW_COUNT=0
          while IFS= read -r -d '' fw; do
              fw_name=$(basename "$fw" .framework)
              fw_id="ai.localpdf.framework.${fw_name}"
              codesign --force --options runtime --timestamp \
                  --sign "$APP_ID" --entitlements "$ENT" \
                  --identifier "$fw_id" \
                  "$fw" >/dev/null
              FW_COUNT=$((FW_COUNT + 1))
          done < <(find "$APP/Contents" -depth -name "*.framework" -type d -print0)
          echo "Phase 2: signed $FW_COUNT frameworks."

      - name: Sign the outer .app
        env:
          APP_ID: ${{ secrets.MAS_APP_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp \
              --sign "$APP_ID" \
              --entitlements "$GITHUB_WORKSPACE/assets/entitlements/mas.entitlements" \
              dist/LocalPDF.app

      - name: Verify signing
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 dist/LocalPDF.app
          codesign --display --entitlements - dist/LocalPDF.app | head -40

      - name: Build signed .pkg
        env:
          INSTALLER_ID: ${{ secrets.MAS_INSTALLER_IDENTITY }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PKG="dist/LocalPDF-${VERSION}-mas.pkg"
          productbuild \
              --component dist/LocalPDF.app /Applications \
              --sign "$INSTALLER_ID" \
              "$PKG"
          pkgutil --check-signature "$PKG"

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalPDF-${{ inputs.version }}-mas
          path: dist/LocalPDF-*-mas.pkg
          retention-days: 30

      - name: Upload to App Store Connect
        if: inputs.upload_to_app_store == 'true'
        env:
          API_KEY_B64: ${{ secrets.APPSTORE_API_PRIVATE_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_B64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          PKG=$(ls dist/LocalPDF-*-mas.pkg | head -1)
          xcrun altool --upload-app --type osx --file "$PKG" \
                       --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
