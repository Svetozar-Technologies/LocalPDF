name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.0.0)'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            # refs/tags/v2.0.0 -> 2.0.0
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER"     >> "$GITHUB_OUTPUT"

  build-macos:
    needs: resolve-version
    runs-on: macos-latest
    env:
      LOCALPDF_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build app
        run: pyinstaller LocalPDF.spec --clean --noconfirm

      - name: Create DMG
        run: bash scripts/create_dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: LocalPDF-macOS
          path: dist/LocalPDF-*.dmg

  build-windows:
    needs: resolve-version
    runs-on: windows-latest
    env:
      LOCALPDF_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Generate Windows icon
        run: python scripts/generate_ico.py

      - name: Build app
        run: pyinstaller LocalPDF.spec --clean --noconfirm

      - name: Zip Windows build
        shell: pwsh
        run: |
          $ver = $env:LOCALPDF_VERSION
          Compress-Archive -Path dist/LocalPDF/* -DestinationPath "dist/LocalPDF-$ver-Windows.zip"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LocalPDF-Windows
          path: dist/LocalPDF-*-Windows.zip

  build-linux:
    needs: resolve-version
    runs-on: ubuntu-22.04
    env:
      LOCALPDF_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build app
        run: pyinstaller LocalPDF.spec --clean --noconfirm

      - name: Create tarball
        run: tar -czf "dist/LocalPDF-${LOCALPDF_VERSION}-Linux.tar.gz" -C dist LocalPDF

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: LocalPDF-Linux
          path: dist/LocalPDF-*-Linux.tar.gz

  release:
    needs: [resolve-version, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: LocalPDF-macOS
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: LocalPDF-Windows
          path: artifacts/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: LocalPDF-Linux
          path: artifacts/

      - name: Determine version
        id: version
        run: |
          echo "tag=${{ needs.resolve-version.outputs.tag }}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LocalPDF ${{ steps.version.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
